<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Traccker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="main-container">
        <h1>Expense Tracker</h1>
        <div class="container">
            <div class="field">
                <label for="">Description</label>
                <input type="text" id="description" placeholder="Expense Description">
            </div>

            <div class="field">

                <label for="">Amount</label>
                <input type="number" name="" id="amount" placeholder="Amount in ₹">
            </div>


            <div class="field">
                <label for="">Cateogory</label>
                <select name="" id="opt">
                    <option value="Food">Food</option>
                    <option value="Travel">Travel</option>
                    <option value="Grocery">Grocery</option>
                    <option value="Rent">Rent</option>
                    <option value="Lend">Lend</option>
                    <option value="Other">Other</option>
                </select>

            </div>

            <button id="btn">Add Expense</button>

            <ul>

            </ul>

            <div class="expense"></div>

        </div>
    </div>

    <script src="logic.js"></script>
</body>

</html>
